name: Test template rendering with vars_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: hardened/tests/fixtures/basic.tmpl
          vars_path: hardened/tests/fixtures/vars.yaml

      - name: Assert rendered output contains expected content from vars_path
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          if ! echo "$RESULT" | grep -q "World"; then
            echo "FAIL: expected 'World' in result (from vars_path)"
            exit 1
          fi
          echo "PASS"
